*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#111;--paper:#F3F0E9;--lime:#C8F542;--amber:#FFC53D;--red:#FF5A5A;--line:#111}
html{scrollbar-gutter:stable}
body{background:var(--paper);color:var(--ink);font-family:'Vazirmatn',system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px 140px}
/* ===== header ===== */
.topbar{background:var(--ink);color:#fff;border-radius:0 0 28px 28px;padding:20px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:34px;letter-spacing:.5px}
.brand b{color:var(--lime)}
.topbar .sub{font-size:15px;opacity:.85;font-weight:700}
.topbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font-weight:800;font-size:17px;padding:11px 22px;transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{background:transparent;color:#fff;border-color:#fff}
.btn.small{font-size:15px;padding:8px 16px;border-width:2px}
.btn.danger{background:#fff;border-color:var(--red);color:#c81e1e}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1.page{font-weight:900;font-size:44px;line-height:1.2;margin:30px 2px 6px}
p.lead{font-size:19px;font-weight:700;color:#444;margin:0 2px 22px;line-height:1.7}
.backbtn{display:inline-flex;align-items:center;gap:6px;margin-top:22px;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px}
/* ===== cards / grids ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:8px}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;overflow:hidden;text-align:right;position:relative;box-shadow:5px 5px 0 var(--ink)}
.card .cover{height:170px;position:relative;overflow:hidden;background:#e8e4da;display:flex;align-items:center;justify-content:center}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .cover .designed{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;padding:10px}
.card .cover .designed .big{font-weight:900;font-size:52px;line-height:1}
.card .cover .designed .ser{font-weight:800;font-size:17px;opacity:.95}
.card .body{padding:16px 18px 18px}
.card .code{font-weight:900;font-size:30px;direction:ltr;text-align:right}
.card .book{font-weight:700;font-size:17px;color:#444;margin-top:2px;line-height:1.5}
.card .count{margin-top:10px;display:inline-block;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px}
.card .count.lime{background:var(--lime)}
.cardlink{display:block}
.cardlink:active .card{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.rowbtns{display:flex;gap:8px;margin-top:12px}
.iconbtn{flex:1;border:2px solid var(--ink);border-radius:12px;background:#fff;font-weight:800;font-size:15px;padding:9px 6px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn.del{border-color:var(--red);color:#c81e1e}
/* ===== teacher rows ===== */
.trow{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px 20px;margin-top:14px;box-shadow:5px 5px 0 var(--ink);width:100%;text-align:right}
.trow:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.avatar{width:64px;height:64px;min-width:64px;border-radius:50%;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;border:3px solid var(--ink)}
.trow .nm{font-weight:900;font-size:26px;line-height:1.3}
.trow .meta{font-weight:700;font-size:16px;color:#555;margin-top:2px}
.trow .chev{margin-inline-start:auto;font-size:28px;font-weight:900}
/* ===== student rows ===== */
.srow{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 18px;margin-top:12px;width:100%;text-align:right}
.srow .nm{font-weight:800;font-size:21px}
.srow .sc{font-weight:700;font-size:15px;color:#555}
.srow .sc b{color:var(--ink)}
.srow .chev{margin-inline-start:auto;font-size:24px;font-weight:900}
.srow .mini{border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;font-size:14px;padding:7px 10px}
.srow .mini.del{border-color:var(--red);color:#c81e1e}
/* ===== forms ===== */
.panel{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:24px;margin-top:18px;box-shadow:5px 5px 0 var(--ink)}
.panel h2{font-weight:900;font-size:26px;margin-bottom:4px}
.panel .hint{font-weight:700;color:#555;font-size:16px;line-height:1.7;margin-bottom:14px}
.field{margin-top:16px}
.field label{display:block;font-weight:800;font-size:17px;margin-bottom:8px}
.field input[type=text],.field input[type=password],.field input[type=number],.field select{width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 16px;font-size:18px;font-weight:700;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--lime)}
.field .req{color:#c81e1e}
.err{background:#ffe3e3;border:3px solid var(--red);color:#8f1d1d;border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;margin-top:14px;line-height:1.6}
.ok{background:#eefcd2;border:3px solid var(--ink);border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;margin-top:14px;line-height:1.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.segcard{border:3px solid var(--ink);border-radius:20px;padding:20px 14px;text-align:center;background:#fff;font-weight:900;font-size:24px;cursor:pointer}
.segcard small{display:block;font-weight:700;font-size:16px;color:#555;margin-top:4px}
.segcard.on{background:var(--lime)}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.bookopt{border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;padding:0;text-align:center}
.bookopt .bc{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:2px}
.bookopt .bc img{width:100%;height:100%;object-fit:cover;display:block}
.bookopt .bc .big{font-weight:900;font-size:34px;line-height:1}
.bookopt .bc .ser{font-weight:800;font-size:13px}
.bookopt .bn{padding:10px 8px;font-weight:800;font-size:15px;line-height:1.4}
.bookopt.on{box-shadow:0 0 0 4px var(--lime)}
.stepnum{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--lime);align-items:center;justify-content:center;font-weight:900;font-size:19px;margin-inline-end:10px}
.addrow{display:flex;gap:10px;margin-top:8px}
.addrow input[type=text]{flex:2}
.addrow input[type=number]{flex:1;min-width:110px}
.sturow{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;margin-top:10px;flex-wrap:wrap}
.sturow .nm{font-weight:800;font-size:18px}
.sturow .sc{font-weight:700;font-size:15px;color:#555}
.sturow .sp{flex:1}
.sturow input[type=text]{flex:2;min-width:140px;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700}
.sturow input[type=number]{flex:1;min-width:90px;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700}
.sturow .mini{border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;font-size:14px;padding:7px 10px}
.sturow .mini.del{border-color:var(--red);color:#c81e1e}
/* ===== report card ===== */
.rc{background:#fff;border:3px solid var(--ink);border-radius:28px;overflow:hidden;margin-top:22px;box-shadow:6px 6px 0 var(--ink)}
.rc .rc-head{background:var(--ink);color:#fff;padding:22px 24px;text-align:center}
.rc .rc-head .t1{font-weight:900;font-size:28px}
.rc .rc-head .t2{font-weight:700;font-size:16px;opacity:.85;margin-top:4px}
.rc .rc-body{padding:26px 24px;text-align:center}
.rc .rc-name{font-weight:900;font-size:34px}
.rc .rc-meta{font-weight:700;font-size:17px;color:#555;margin-top:6px;line-height:1.8}
.rc .big-score{font-weight:900;font-size:96px;line-height:1.1;margin-top:14px}
.rc .big-score small{font-size:34px;font-weight:800}
.statuspill{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:8px 26px;font-weight:900;font-size:22px;margin-top:10px}
.statuspill.pass{background:var(--lime)}
.statuspill.cond{background:var(--amber)}
.statuspill.fail{background:var(--red);color:#fff}
.rc .note{font-weight:700;font-size:16px;color:#555;margin-top:12px;line-height:1.8}
.rc .noscore{padding:18px 10px}
.rc .noscore .big{font-size:64px}
.rc .noscore p{font-weight:900;font-size:26px;margin-top:8px;line-height:1.6}
.rc .noscore span{display:block;font-weight:700;font-size:17px;color:#555;margin-top:6px}
/* ===== FAB ===== */
.fab{position:fixed;bottom:26px;right:26px;z-index:50;display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:16px 26px;font-weight:900;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fab .plus{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;line-height:1}
.fab:active{transform:scale(.96)}
/* ===== auth ===== */
.authtabs{display:flex;gap:10px;margin-top:18px}
.authtabs button{flex:1;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;font-size:18px;padding:12px}
.authtabs button.on{background:var(--lime)}
.foot{text-align:center;font-weight:700;color:#777;font-size:14px;margin-top:44px;line-height:1.8}
.empty{background:#fff;border:3px dashed var(--ink);border-radius:22px;padding:30px 20px;text-align:center;font-weight:800;font-size:18px;color:#555;margin-top:18px;line-height:1.9}
@media (max-width:560px){
  h1.page{font-size:36px}
  .brand{font-size:28px}
  .seg{grid-template-columns:1fr 1fr}
  .addrow{flex-wrap:wrap}
  .addrow input[type=text]{flex:1 1 100%}
}
</style>
</head>

const BOOKS_ADULT = ['American English File Starter','American English File 1','American English File 2','American English File 3','American English File 4','American English File 5'];
const BOOKS_TEEN = ['Family and Friends Starter','Family and Friends 1','Family and Friends 2','Family and Friends 3','Family and Friends 4','Family and Friends 5','Family and Friends 6'];
const COVER_BY_BOOK = {};
Object.values(SEED.books).forEach(b => { COVER_BY_BOOK[b.book] = b.cover; });
function bookSeries(book){ return book.indexOf('American English File') === 0 ? 'AEF' : 'F&F'; }
function bookShort(book){
  if (book.indexOf('American English File') === 0) return book.replace('American English File ', 'AEF ');
  return book.replace('Family and Friends ', 'F&F ');
}
function bookColor(book){
  const s = bookSeries(book);
  if (s === 'AEF') return 'linear-gradient(135deg,#1d4ed8,#0f2a6b)';
  return 'linear-gradient(135deg,#0e9f6e,#065f46)';
}
function coverHTML(book, big){
  const c = COVER_BY_BOOK[book];
  if (c) return '<img src="' + c + '" alt="">';
  return '<div class="designed" style="background:' + bookColor(book) + '"><div class="big">' + esc(bookShort(book)) + '</div><div class="ser">' + esc(book) + '</div></div>';
}
/* ================= Store (Google Sheet API + local cache) ================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwSHhNVrsM3_B6By1aIsnXwPvdUNZPwFCawXutTHLmndkDtWC8_OegFAZvRPPCfO9Iv/exec';
const LS_KEY = 'linglow-v1';
const LS_SESSION = 'linglow-session';
let DB = null;
function uid(){ return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function hashPw(u, p){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  const s = u + '::' + p;
  for (let i = 0; i < s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
function levelLabel(kind, level){ return (kind === 'adult' ? 'ARC ' : 'FF ') + level; }
function seedDB(){
  const t = { id: 't-mohammad', username: 'mohammad', displayName: 'محمد شولی', passHash: null, classes: [] };
  const order = [['ARC 9','adult',9],['ARC 12','adult',12],['ARC 20','adult',20],['FF18','teen',18],['FF19','teen',19],['FF26','teen',26]];
  order.forEach(([key, kind, level]) => {
    const book = SEED.books[key].book;
    const students = (SEED.roster[key] || []).map(name => {
      let score = null;
      if (SEED.scores[key] && Object.prototype.hasOwnProperty.call(SEED.scores[key], name)) score = SEED.scores[key][name];
      return { id: uid(), name, score };
    });
    t.classes.push({ id: uid(), kind, level, book, students });
  });
  return { teachers: [t] };
}
function loadCache(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.teachers)) return d; }
  } catch (e) {}
  return null;
}
function saveCache(){ try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {} }
async function apiGet(action){
  const r = await fetch(API_URL + '?action=' + action);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPost(action, payload){
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action }, payload)) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function refreshDB(){
  try {
    const data = await apiGet('read');
    if (data && Array.isArray(data.teachers)){ DB = data; saveCache(); }
    else if (!DB){ DB = loadCache() || seedDB(); }
  } catch (e){
    if (!DB){ DB = loadCache() || seedDB(); }
  }
  render();
}
function getSession(){
  try { const raw = localStorage.getItem(LS_SESSION); return raw ? JSON.parse(raw) : null; } catch (e){ return null; }
}
function setSession(s){ try { if (s) localStorage.setItem(LS_SESSION, JSON.stringify(s)); else localStorage.removeItem(LS_SESSION); } catch (e){} }
function currentTeacher(){
  const s = getSession();
  if (!s || !s.username || !DB) return null;
  return DB.teachers.find(t => t.username === s.username) || null;
}
function findTeacherByUsername(u){ return DB ? DB.teachers.find(t => t.username === u) : undefined; }
/* ================= Helpers ================= */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function faNum(n){ return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]); }
function statusOf(score){
  if (score == null) return null;
  if (score > 75) return { label: 'قبول', cls: 'pass', note: 'آفرین! این ترم رو با موفقیت گذروندی.' };
  if (score >= 65) return { label: 'قبول مشروط', cls: 'cond', note: 'قبول شدی، ولی به شرط اینکه ترم بعد بالای ۹۵ بگیری.' };
  return { label: 'مردود', cls: 'fail', note: 'نمره‌ت به حد نصاب نرسید؛ باید این ترم رو دوباره بگذرونی.' };
}

async function doLogin(){
  const u = (document.getElementById('li-user').value || '').trim().toLowerCase();

  const box = document.getElementById('li-setpw');
  if (box && box.querySelector('input')){
    const np = document.getElementById('li-newpass').value || '';
    const np2 = document.getElementById('li-newpass2').value || '';
    if (np.length < 6){ authError = 'رمز باید حداقل ۶ کاراکتر باشه.'; render(); return; }
    if (np !== np2){ authError = 'تکرار رمز با رمز یکی نیست.'; render(); return; }
    try {
      const r = await apiPost('setPassword', { username: u, passHash: hashPw(u, np) });
      if (!r.ok){ authError = 'تعیین رمز انجام نشد. دوباره امتحان کن.'; render(); return; }

      authError = '';
      await refreshDB();
    } catch (e){ authError = 'به سرور وصل نشد. اینترنت رو چک کن و دوباره امتحان کن.'; render(); }

    if (r.needsPassword){
      box.innerHTML = '<div class="field"><label>این حساب هنوز رمز ندارد — رمز عبور خودت رو تعیین کن <span class="req">*</span></label>' +
        '<input type="password" id="li-newpass" placeholder="رمز جدید (حداقل ۶ کاراکتر)" autocomplete="new-password"></div>' +
        '<div class="field"><label>تکرار رمز جدید</label><input type="password" id="li-newpass2" placeholder="رمز رو دوباره بنویس" autocomplete="new-password"></div>' +
        '<div class="hint" style="margin-top:10px">رمز رو بنویس و دوباره دکمه‌ی ورود رو بزن.</div>';
      return;
    }
    if (!r.ok){ authError = (r.error === 'no such user' ? 'چنین یوزرنیمی ثبت نشده است. اگه معلم جدیدی هستی، از تب «ثبت‌نام معلم جدید» ثبت‌نام کن.' : 'پسورد اشتباهه. دوباره امتحان کن.'); render(); return; }
    setSession({ username: u, passHash: hashPw(u, p) });
    authError = '';
    await refreshDB();
  } catch (e){ authError = 'به سرور وصل نشد. اینترنت رو چک کن و دوباره امتحان کن.'; render(); }
}
async function doRegister(){
  const name = (document.getElementById('rg-name').value || '').trim();
  const u = (document.getElementById('rg-user').value || '').trim().toLowerCase();
  const p = document.getElementById('rg-pass').value || '';
  const p2 = document.getElementById('rg-pass2').value || '';
  if (!name){ authError = 'اسم نمایشی رو بنویس.'; render(); return; }
  if (!/^[a-z0-9][a-z0-9\-_]{2,30}$/.test(u)){ authError = 'یوزرنیم باید انگلیسی باشه: با حرف یا عدد شروع بشه و فقط حروف کوچک، عدد، خط تیره (-) یا آندرلاین (_) داشته باشه.'; render(); return; }
  if (p.length < 6){ authError = 'پسورد باید حداقل ۶ کاراکتر باشه.'; render(); return; }
  if (p !== p2){ authError = 'تکرار پسورد با پسورد یکی نیست.'; render(); return; }
  try {
    const r = await apiPost('register', { username: u, displayName: name, passHash: hashPw(u, p) });
    if (!r.ok){ authError = (r.error === 'username taken' ? 'این یوزرنیم قبلاً گرفته شده؛ یه یوزرنیم دیگه انتخاب کن.' : 'ثبت‌نام انجام نشد. دوباره امتحان کن.'); render(); return; }
    setSession({ username: u, passHash: hashPw(u, p) });
    authError = '';
    await refreshDB();
  } catch (e){ authError = 'به سرور وصل نشد. اینترنت رو چک کن و دوباره امتحان کن.'; render(); }
}
function doLogout(){ setSession(null); go('#/'); }
/* ================= Admin: home ================= */
function viewAdminHome(me){
  let h = headerHTML(false);
  h += '<div style="display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap">' +
    '<h1 class="page" style="margin:0">سلام ' + esc(me.displayName) + ' 👋</h1>' +
    '<span style="flex:1"></span><button class="btn small" onclick="doLogout()">خروج</button></div>';
  h += '<p class="lead">این‌ها کلاس‌های توئه. برای اضافه کردن کلاس جدید، دکمه‌ی «ایجاد کلاس» پایین صفحه رو بزن.</p>';
  if (!me.classes.length){
    h += '<div class="empty">هنوز کلاسی نساختی.<br>دکمه‌ی «＋ ایجاد کلاس» پایین صفحه رو بزن و اولین کلاست رو بساز.</div>';
  }
  h += '<div class="grid">';
  me.classes.slice().sort((a, b) => (a.kind === b.kind ? a.level - b.level : (a.kind === 'adult' ? -1 : 1))).forEach(c => {
    h += '<div class="card"><div class="cover">' + coverHTML(c.book) + '</div>' +
      '<div class="body"><div class="code">' + esc(levelLabel(c.kind, c.level)) + '</div>' +
      '<div class="book">' + esc(c.book) + '</div>' +
      '<span class="count">' + classCountLabel(c.students.length) + '</span>' +
      '<div class="rowbtns">' +
      '<button class="iconbtn" onclick="go(\'#/edit/' + c.id + '\')">✏️ ویرایش</button>' +
      '<button class="iconbtn del" onclick="deleteClass(\'' + c.id + '\')">🗑️ حذف</button>' +
      '</div></div></div>';
  });
  h += '</div>';
  h += '<button class="fab" onclick="go(\'#/new\')"><span class="plus">＋</span> ایجاد کلاس</button>';
  return h;
}
async function deleteClass(id){
  const me = currentTeacher(); if (!me) return;
  const c = me.classes.find(x => x.id === id); if (!c) return;
  if (!confirm('کلاس «' + levelLabel(c.kind, c.level) + '» با ' + c.students.length + ' دانش‌آموز حذف بشه؟ این کار برگشت‌پذیر نیست.')) return;
  const s = getSession();
  try {
    const r = await apiPost('deleteClass', { username: s.username, passHash: s.passHash, classId: id });
    if (!r.ok){ alert('حذف انجام نشد. دوباره امتحان کن.'); return; }
    await refreshDB();
  } catch (e){ alert('به سرور وصل نشد. اینترنت رو چک کن و دوباره امتحان کن.'); }
}
/* ================= Admin: create / edit class ================= */
let form = null;
function blankForm(){ return { _key: 'new', editingId: null, kind: '', level: '', book: '', students: [] }; }
function loadForm(editId){
  if (editId){
    const me = currentTeacher();
    const c = me && me.classes.find(x => x.id === editId);
    if (!c) return null;
    return { _key: 'edit:' + editId, editingId: editId, kind: c.kind, level: String(c.level), book: c.book,
      students: c.students.map(s => ({ id: s.id, name: s.name, score: s.score, _edit: false })) };
  }
  return blankForm();
}
function bookOptions(kind){ return kind === 'adult' ? BOOKS_ADULT : (kind === 'teen' ? BOOKS_TEEN : []); }
function viewClassForm(editId){
  const me = currentTeacher();
  if (!me) return viewAdmin();
  const key = editId ? 'edit:' + editId : 'new';
  if (!form || form._key !== key) { form = loadForm(editId); if (!form) return viewAdminHome(me); }
  const isEdit = !!editId;
  let h = headerHTML(false) + backHTML();
  h += '<h1 class="page">' + (isEdit ? 'ویرایش کلاس' : 'ایجاد کلاس جدید') + '</h1>';
  h += '<p class="lead">قدم‌به‌قدم جلو برو: اول نوع کلاس، بعد شماره‌ی لول، بعد کتاب، و در آخر دانش‌آموزها.</p>';
  /* step 1: kind */
  h += '<div class="panel"><h2><span class="stepnum">۱</span>کلاس بزرگساله یا نوجوان؟</h2>' +
    '<div class="seg">' +
    '<button class="segcard ' + (form.kind === 'adult' ? 'on' : '') + '" onclick="formKind(\'adult\')">بزرگسال<small>ARC</small></button>' +
    '<button class="segcard ' + (form.kind === 'teen' ? 'on' : '') + '" onclick="formKind(\'teen\')">نوجوان<small>FF</small></button>' +
    '</div></div>';
  /* step 2: level number */
  h += '<div class="panel"><h2><span class="stepnum">۲</span>شماره‌ی لول چنده؟</h2>' +
    '<div class="field"><label>عدد لول <span class="req">*</span></label><select id="f-level" onchange="formLevel(this.value)" ' + (form.kind ? '' : 'disabled') + '>' +
    '<option value="">— انتخاب کن —</option>';
  for (let n = 1; n <= 30; n++) h += '<option value="' + n + '"' + (String(n) === String(form.level) ? ' selected' : '') + '>' + faNum(n) + '</option>';
  h += '</select>' + (form.kind ? '' : '<div class="hint" style="margin-top:8px">اول نوع کلاس رو انتخاب کن.</div>') + '</div></div>';
  /* step 3: book */
  h += '<div class="panel"><h2><span class="stepnum">۳</span>چه کتابی تدریس می‌کنی؟</h2>';
  if (!form.kind){
    h += '<div class="hint">اول نوع کلاس رو انتخاب کن تا کتاب‌های مربوط به همون رده نشون داده بشن.</div>';
  } else {
    h += '<div class="hint">' + (form.kind === 'adult' ? 'کتاب‌های American English File:' : 'کتاب‌های Family and Friends:') + '</div><div class="bookgrid">';
    bookOptions(form.kind).forEach(b => {
      h += '<button class="bookopt ' + (form.book === b ? 'on' : '') + '" onclick="formBook(\'' + esc(b) + '\')">' +
        '<span class="bc">' + coverHTML(b) + '</span><span class="bn">' + esc(b) + '</span></button>';
    });
    h += '</div>';
  }
  h += '</div>';
  /* step 4: students */
  h += '<div class="panel"><h2><span class="stepnum">۴</span>دانش‌آموزها</h2>' +
    '<div class="hint">اسم و فامیل هر دانش‌آموز رو توی یه کادر بنویس. نمره اختیاریه — اگه هنوز نمره ندادی خالی بذار.</div>' +
    '<div class="addrow"><input type="text" id="f-stu-name" placeholder="اسم و فامیل دانش‌آموز">' +
    '<input type="number" id="f-stu-score" min="0" max="100" placeholder="نمره (اختیاری)">' +
    '<button class="btn lime" onclick="formAddStudent()">＋ افزودن</button></div>' +
    '<div id="f-stu-err"></div>';
  if (!form.students.length){
    h += '<div class="empty" style="box-shadow:none">هنوز دانش‌آموزی اضافه نشده.</div>';
  }
  form.students.forEach((s, i) => {
    if (s._edit){
      h += '<div class="sturow"><input type="text" id="f-edit-name-' + i + '" value="' + esc(s.name) + '">' +
        '<input type="number" id="f-edit-score-' + i + '" min="0" max="100" placeholder="نمره" value="' + (s.score == null ? '' : s.score) + '">' +
        '<button class="mini" onclick="formSaveStudent(' + i + ')">✓ ثبت</button>' +
        '<button class="mini" onclick="formCancelEdit(' + i + ')">✕ لغو</button></div>';
    } else {
      h += '<div class="sturow"><span class="nm">' + esc(s.name) + '</span>' +
        '<span class="sc">' + (s.score == null ? 'بدون نمره' : 'نمره: ' + faNum(s.score)) + '</span><span class="sp"></span>' +
        '<button class="mini" onclick="formEditStudent(' + i + ')">✏️ ویرایش</button>' +
        '<button class="mini del" onclick="formDelStudent(' + i + ')">🗑️ حذف</button></div>';
    }
  });
  h += '</div>';
  /* save */
  h += '<div style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap">' +
    '<button class="btn lime" style="flex:1;justify-content:center;font-size:19px;padding:15px" onclick="formSave()">✓ ' + (isEdit ? 'ذخیره‌ی تغییرات' : 'ساختن کلاس') + '</button>' +
    '<button class="btn" onclick="go(\'#\')">لغو</button></div>';
  h += '<div id="f-err"></div>';
  return h;
}
function formKind(k){
  if (form.kind !== k){ form.kind = k; form.book = ''; }
  render();
}
function formLevel(v){ form.level = v; }
function formBook(b){ form.book = b; render(); }
function formAddStudent(){
  const nameEl = document.getElementById('f-stu-name');
  const scoreEl = document.getElementById('f-stu-score');
  const name = (nameEl.value || '').trim();
  const err = document.getElementById('f-stu-err');
  if (!name){ err.innerHTML = '<div class="err">اسم دانش‌آموز رو بنویس.</div>'; return; }
  let score = null;
  if (scoreEl.value !== '' && scoreEl.value != null){
    score = Number(scoreEl.value);
    if (isNaN(score) || score < 0 || score > 100){ err.innerHTML = '<div class="err">نمره باید بین ۰ تا ۱۰۰ باشه.</div>'; return; }
  }
  form.students.push({ id: uid(), name, score, _edit: false });
  render();
}
function formEditStudent(i){ form.students[i]._edit = true; render(); setTimeout(() => { const el = document.getElementById('f-edit-name-' + i); if (el) el.focus(); }, 50); }
function formCancelEdit(i){ form.students[i]._edit = false; render(); }
function formSaveStudent(i){
  const s = form.students[i];
  const name = (document.getElementById('f-edit-name-' + i).value || '').trim();
  const v = document.getElementById('f-edit-score-' + i).value;
  if (!name){ alert('اسم دانش‌آموز رو بنویس.'); return; }
  let score = null;
  if (v !== '' && v != null){ score = Number(v); if (isNaN(score) || score < 0 || score > 100){ alert('نمره باید بین ۰ تا ۱۰۰ باشه.'); return; } }
  s.name = name; s.score = score; s._edit = false;
  render();
}
function formDelStudent(i){ form.students.splice(i, 1); render(); }
async function formSave(){
  const err = document.getElementById('f-err');
  const fail = m => { err.innerHTML = '<div class="err">' + m + '</div>'; window.scrollTo(0, document.body.scrollHeight); };
  if (!form.kind) return fail('قدم ۱: نوع کلاس (بزرگسال یا نوجوان) رو انتخاب کن.');
  if (!form.level) return fail('قدم ۲: شماره‌ی لول رو انتخاب کن.');
  if (!form.book) return fail('قدم ۳: کتاب کلاس رو انتخاب کن.');
  if (!form.students.length) return fail('قدم ۴: حداقل یه دانش‌آموز اضافه کن.');
  const me = currentTeacher(); if (!me) return go('#');
  const s = getSession();
  const classId = form.editingId || uid();
  const data = { id: classId, kind: form.kind, level: Number(form.level), book: form.book,
    students: form.students.map(s => ({ id: s.id, name: s.name, score: s.score })) };
  try {
    const r = await apiPost('saveClass', { username: s.username, passHash: s.passHash, classId: classId, class: data });
    if (!r.ok){ fail('ذخیره انجام نشد. دوباره امتحان کن.'); return; }
    form = null;
    go('#/');
    await refreshDB();
  } catch (e){ fail('به سرور وصل نشد. اینترنت رو چک کن و دوباره امتحان کن.'); }
}
/* ================= Router ================= */
function render(){
  const app = document.getElementById('app');
  if (!DB){ app.innerHTML = headerHTML(false) + '<div class="empty">⏳ در حال بارگذاری…</div>'; return; }
  const raw = (location.hash || '#/').replace(/^#\/?/, '');
  const p = raw.split('/').filter(s => s !== '');
  let html;
  if (p.length === 0) html = viewAdmin();
  else if (p.length === 1 && p[0] === 'new') html = currentTeacher() ? viewClassForm(null) : viewAdmin();
  else if (p.length === 2 && p[0] === 'edit') html = currentTeacher() ? viewClassForm(p[1]) : viewAdmin();
  else html = viewAdmin();
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
refreshDB();
</script>
</body>
